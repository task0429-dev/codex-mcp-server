services:
  command-center:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: task-command-center
    env_file:
      - ../../.env
      - ./.env.oracle
    environment:
      - NODE_ENV=production
      - HTTP_PORT=3000
      - HTTP_HOST=0.0.0.0
      - AGENT_RUNNER_ENABLED=false
      - DESKTOP_RELAY_URL=http://100.92.198.40:3099
    volumes:
      - ../../data:/app/data
      - ../../workspaces:/app/workspaces
      - ../../control-ui:/app/control-ui:ro
      - ../../dist:/app/dist:ro
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 45s

  caddy:
    image: caddy:2.10
    container_name: task-command-center-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH}
      - TRUSTED_DEVICE_COOKIE_VALUE=${TRUSTED_DEVICE_COOKIE_VALUE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      command-center:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
